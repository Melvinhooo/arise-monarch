<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1a0a3a" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#0a0418" stop-opacity="1"/>
      <stop offset="100%" stop-color="#050810" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="boltGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="40%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="180" ry="180" fill="url(#bgGlow)"/>

  <circle cx="512" cy="512" r="380" fill="none" stroke="rgba(168,85,247,0.18)" stroke-width="2"/>
  <circle cx="512" cy="512" r="300" fill="none" stroke="rgba(168,85,247,0.10)" stroke-width="1"/>

  <g filter="url(#boltGlow)">
    <path
      d="M 580 130
         L 320 540
         L 480 540
         L 380 870
         L 720 460
         L 560 460
         L 660 130
         Z"
      fill="url(#boltGrad)"
      stroke="#fff"
      stroke-width="6"
      stroke-linejoin="round"/>
  </g>
</svg>
