<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bgC" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a0a3a" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#0a0418" stop-opacity="1"/>
      <stop offset="100%" stop-color="#050810" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="30%" stop-color="#fbbf24"/>
      <stop offset="65%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="crownGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="180" ry="180" fill="url(#bgC)"/>
  <circle cx="512" cy="500" r="380" fill="none" stroke="rgba(168,85,247,0.18)" stroke-width="2"/>

  <g filter="url(#crownGlow)" transform="translate(0,40)">
    <!-- Crown body: 5 spikes + base band -->
    <path
      d="M 220 540
         L 280 280
         L 380 460
         L 460 240
         L 512 420
         L 564 240
         L 644 460
         L 744 280
         L 804 540
         Z"
      fill="url(#crownGrad)"
      stroke="#fff"
      stroke-width="6"
      stroke-linejoin="round"/>
    <rect x="220" y="540" width="584" height="120" rx="14" ry="14" fill="url(#crownGrad)" stroke="#fff" stroke-width="6"/>
    <!-- Gem accents on the band -->
    <circle cx="340" cy="600" r="22" fill="#a855f7" stroke="#fff" stroke-width="3"/>
    <circle cx="512" cy="600" r="28" fill="#fbbf24" stroke="#fff" stroke-width="3"/>
    <circle cx="684" cy="600" r="22" fill="#a855f7" stroke="#fff" stroke-width="3"/>
    <!-- Spike-tip jewels -->
    <circle cx="280" cy="280" r="14" fill="#fff"/>
    <circle cx="460" cy="240" r="14" fill="#fff"/>
    <circle cx="564" cy="240" r="14" fill="#fff"/>
    <circle cx="744" cy="280" r="14" fill="#fff"/>
  </g>
</svg>
